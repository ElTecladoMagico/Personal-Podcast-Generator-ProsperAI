[project]
name = "podcast-api"
version = "0.1.0"
description = "Personal Podcast Generator API"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "elevenlabs>=2.70.0",
    "fastapi[standard]>=0.142.2",
    "feedparser>=6.0.14",
    "httpx>=0.28.1",
    "openai>=3.22.1",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "pyjwt[crypto]>=2.15.1",
    "sqlmodel>=0.0.47",
    "trafilatura>=2.2.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.ruff]
line-length = 100
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
markers = ["live: calls real external APIs (deselected by default)"]
addopts = "-m 'not live'"
