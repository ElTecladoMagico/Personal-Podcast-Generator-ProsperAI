# Neutral reverse proxy for every project on the VPS (lives in /opt/edge, not in any project).
# Projects attach their public containers to the external `edge` network; nobody depends on
# anybody else's compose. Runbook: deploy/README.md ("Proxy edge").
name: edge

services:
  caddy:
    image: caddy:2-alpine
    container_name: edge-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge]

# Created once by hand (deploy/README.md): projects join `edge` and must not depend on
# this compose having run; the certificates outlive any re-creation of the proxy.
networks:
  edge:
    external: true

volumes:
  caddy_data:
    external: true
    name: edge_caddy_data
  caddy_config:
